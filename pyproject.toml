[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pactobridge"
version = "0.1.0"
description = "Passive ZIPRO Pacto BLE capture and evidence-gated running sensor bridge"
requires-python = ">=3.12"
dependencies = ["bleak>=0.22.3,<4"]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
sensor = ["bless>=0.2.6,<1"]
network = ["zeroconf>=0.132,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
pactobridge = "pactobridge.cli:main"

[tool.setuptools.packages.find]
include = ["pactobridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
